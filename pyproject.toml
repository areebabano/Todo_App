[project]
name = "chief-of-staff"
version = "0.1.0"
description = "Smart Personal Chief of Staff - A CLI task management application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "rich>=14.2.0",
]

[project.scripts]
chief = "chief_of_staff.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chief_of_staff"]
